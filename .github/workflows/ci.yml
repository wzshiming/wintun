name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -race -count=1
      - name: Build without cgo
        shell: bash
        run: CGO_ENABLED=0 go build ./...
      - name: Cross-compile for every Windows architecture and an unsupported OS
        if: matrix.os == 'ubuntu-latest'
        run: |
          for arch in 386 amd64 arm64; do
            CGO_ENABLED=0 GOOS=windows GOARCH=$arch go build ./...
            GOOS=windows GOARCH=$arch go vet ./...
          done
          CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 go build ./...
          GOOS=freebsd GOARCH=amd64 go vet ./...
