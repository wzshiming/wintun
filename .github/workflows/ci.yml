name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -race -count=1
      - name: Build without cgo
        shell: bash
        run: CGO_ENABLED=0 go build ./...
      - name: Cross-compile for every Windows architecture and an unsupported OS
        if: matrix.os == 'ubuntu-latest'
        run: |
          for arch in 386 amd64 arm64; do
            CGO_ENABLED=0 GOOS=windows GOARCH=$arch go build ./...
            GOOS=windows GOARCH=$arch go vet ./...
          done
          CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 go build ./...
          GOOS=freebsd GOARCH=amd64 go vet ./...

  dlls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Regenerate the DLLs from the wintun.net release
        run: go generate ./...
      - name: Check the committed files are the release's
        run: |
          git status --porcelain
          git diff --stat --exit-code
          test -z "$(git status --porcelain)"

  # Each DLL runs on every Windows it supports: natively, under WOW64 on amd64 and under emulation on arm64.
  e2e:
    name: e2e (${{ matrix.os }}, ${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, goarch: amd64, race: -race }
          - { os: windows-latest, goarch: '386' }
          - { os: windows-11-arm, goarch: arm64 }
          - { os: windows-11-arm, goarch: amd64 }
          - { os: windows-11-arm, goarch: '386' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        shell: bash
        run: go test ./... -count=1 ${{ matrix.race }}
      - name: Build the e2e test binary
        shell: bash
        run: go test -c ${{ matrix.race }} -o "$RUNNER_TEMP/wintun-e2e.test.exe" .
      # The run fails unless the test reports PASS, so a test skipped by mistake cannot go unnoticed.
      - name: E2E
        shell: bash
        run: |
          WINTUN_E2E=1 "$RUNNER_TEMP/wintun-e2e.test.exe" -test.v -test.run '^TestE2EAdapter$' -test.timeout 5m | tee "$RUNNER_TEMP/wintun-e2e.log"
          grep -qF -- "--- PASS: TestE2EAdapter (" "$RUNNER_TEMP/wintun-e2e.log" || { echo "TestE2EAdapter did not pass"; exit 1; }
      - name: Network state
        if: failure()
        shell: powershell
        run: |
          Get-NetAdapter -IncludeHidden | Format-Table -AutoSize Name, InterfaceDescription, Status, ifIndex
          ipconfig /all
